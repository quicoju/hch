name: hch CI

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch:

jobs:
  test:
    name: Test using ${{ matrix.backend }} backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [memory, sqlite]

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libcatch2-dev \
          libsqlite3-dev \
          libreadline-dev \
          libboost-all-dev \
          g++
      
    - name: test
      run: |
        make clean
        make BACKEND=${{ matrix.backend }} test
